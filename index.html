<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>먼작귀(치이카와) 성격 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body {
            font-family: 'Jua', sans-serif;
            background-color: #fffaf0;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-pink-200">
        <!-- Header -->
        <div class="bg-pink-100 p-6 text-center border-b-2 border-pink-200">
            <h1 class="text-2xl md:text-3xl text-pink-600 font-bold drop-shadow-sm">✨ 먼작귀 성격 테스트 ✨</h1>
            <p class="text-sm text-gray-600 mt-1">나와 닮은 먼작귀는 누구일까요?</p>
        </div>

        <!-- Content Area -->
        <div id="content" class="p-6">
            <!-- Intro Screen -->
            <div id="intro-screen" class="text-center fade-in">
                <img src="main.jpg" alt="먼작귀 친구들" class="w-48 h-48 mx-auto mb-4 object-contain">
                <p class="text-gray-700 mb-6 leading-relaxed">
                    귀여우면서도 왠지 치열하게 살아가고 있는 먼작귀 친구들!<br>
                    나와 꼭 닮은 친구를 찾아보세요.
                </p>
                <button onclick="startTest()" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-6 rounded-2xl shadow-lg transition transform hover:scale-105">
                    테스트 시작하기! 🚀
                </button>
            </div>

            <!-- Quiz Screen -->
            <div id="quiz-screen" class="hidden fade-in">
                <div class="flex justify-between items-center mb-4 text-sm text-pink-500 font-bold">
                    <span id="progress-text">질문 1 / 7</span>
                    <span id="progress-percent">14%</span>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-pink-100 h-3 rounded-full mb-6 overflow-hidden">
                    <div id="progress-bar" class="bg-pink-400 h-full transition-all duration-300" style="width: 14%"></div>
                </div>
                <h2 id="question-text" class="text-lg md:text-xl text-gray-800 font-bold mb-6 text-center min-h-[4rem] flex items-center justify-center"></h2>
                <div id="options-container" class="space-y-2.5">
                    <!-- Options injected via JS -->
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="hidden text-center fade-in">
                <div id="result-emoji" class="text-7xl mb-3"></div>
                <h3 class="text-sm text-pink-400 font-bold tracking-wider uppercase">나와 찰떡궁합인 캐릭터는?</h3>
                <h2 id="result-title" class="text-2xl md:text-3xl font-bold text-gray-800 mt-1 mb-4"></h2>
                <p id="result-desc" class="text-gray-600 bg-pink-50 p-4 rounded-2xl mb-6 text-sm leading-relaxed border border-pink-100"></p>
                
                <div class="space-y-3">
                    <button onclick="restartTest()" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-6 rounded-2xl shadow-lg transition transform hover:scale-105">
                        다시 테스트하기 🔄
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "친구가 맛있는 간식을 나눠주었을 때 나의 행동은?",
                options: [
                    { text: "우와! 감동하여 소중하게 먹는다.", trait: "C" },
                    { text: "고마워하며 씩씩하게 먹고 기쁨을 공유한다.", trait: "H" },
                    { text: "한입에 다 먹어 치운다.", trait: "U" },
                    { text: "간식에 잘 어울리는 음료를 떠올린다.", trait: "KR" },
                    { text: "품위 있게 맛을 음미한다.", trait: "R" }
                ]
            },
            {
                question: "어려운 과제를 마친 후 나만의 스트레스 해소법은?",
                options: [
                    { text: "시원한 음료나 술 한잔 들이킨다.", trait: "KR" },
                    { text: "나를 알아봐 주는 사람들에게 당당히 자랑하고 관심받는다.", trait: "M" },
                    { text: "멋지게 일을 마친 뒤, 혼자만의 달콤한 디저트 타임을 즐긴다.", trait: "R" },
                    { text: "따뜻한 이불속에서 조용히 뒹굴거리며 쉰다.", trait: "C" },
                    { text: "친구들을 모아서 다 함께 소소한 파티를 연다.", trait: "H" }
                ]
            },
            {
                question: "길을 가다가 엄청나게 강력해 보이는 괴물을 만났다!",
                options: [
                    { text: "멋지게 무기를 꺼내어 선두에서 해결한다.", trait: "R" },
                    { text: "위기를 기회로 삼아 냉정하게 대책을 세우고 돌파한다.", trait: "H" },
                    { text: "너무 무서워서 눈물이 나지만 어떻게든 용기를 내본다.", trait: "C" },
                    { text: "기세 좋게 먼저 덤벼들거나 아무렇지 않게 돌진한다.", trait: "U" },
                    { text: "위험해 보이니까 조용히 피해서 내 할 일을 하러 간다.", trait: "KR" }
                ]
            },
            {
                question: "후배가 나에게 도움을 요청하거나 조언을 구한다면?",
                options: [
                    { text: "무심한 척 챙겨주면서 맛있는 음식을 대접한다.", trait: "KR" },
                    { text: "엄격하고 든든한 리더로서 솔선수범하며 이끌어준다.", trait: "R" },
                    { text: "자기 일처럼 다정하게 들어주고 최선을 다해 도와준다.", trait: "H" },
                    { text: "같이 안절부절못하며 고민해주지만 따뜻하게 응원한다.", trait: "C" },
                    { text: "나한테 관심 보이는 건가?! 귀여움을 마구 어필한다.", trait: "M" }
                ]
            },
            {
                question: "중요한 시험이나 자격증 도전을 앞두고 있을 때 나는?",
                options: [
                    { text: "노트를 꼼꼼하게 정리하며 친구들과 스터디를 주도한다.", trait: "H" },
                    { text: "완벽을 기하기 위해 끊임없이 수련하고 자신을 단련한다.", trait: "R" },
                    { text: "시험? 그런 거 모르겠고 내 감과 실력을 믿는다!", trait: "U" },
                    { text: "열심히 준비했지만 막상 당일이 되면 너무 긴장된다.", trait: "C" },
                    { text: "시험 결과보다는 합격해서 받을 칭찬과 관심이 더 중요하다.", trait: "M" }
                ]
            },
            {
                question: "사람들이 보는 나의 평소 이미지나 매력은?",
                options: [
                    { text: "차분하고 어른스러우며 음식 맛을 잘 아는 미식가 스타일", trait: "KR" },
                    { text: "카리스마 있고 의지하고 싶어지는 든든한 스타일", trait: "R" },
                    { text: "자유분방하고 무슨 생각을 하는지 알 수 없는 독창적 스타일", trait: "U" },
                    { text: "귀엽고 도도해서 자꾸만 챙겨주고 싶게 만드는 스타일", trait: "M" },
                    { text: "주변을 잘 챙기고 긍정적인 에너지를 주는 다정한 스타일", trait: "H" }
                ]
            },
            {
                question: "주말에 나에게 완전한 자유시간이 주어진다면?",
                options: [
                    { text: "정갈하게 차려진 맛집을 가거나 혼술을 즐긴다.", trait: "KR" },
                    { text: "드라이브를 떠나거나 자기개발을 하며 보람차게 보낸다.", trait: "R" },
                    { text: "예쁜 옷을 입고 사진을 찍으며 내 귀여움을 만끽한다.", trait: "M" },
                    { text: "정해진 계획 없이 신나게 발길 닿는 대로 모험한다.", trait: "U" },
                    { text: "집을 깨끗이 청소하고 소중한 친구를 초대한다.", trait: "H" }
                ]
            }
        ];

        const results = {
            C: {
                title: "치이카와",
                img: "chiikawa.jpg",
                desc: "당신은 여리고 다정한 감성의 소유자 '치이카와'! 소심하지만 중요한 순간에는 엄청난 용기를 발휘하는 외유내강형이에요. 눈물이 많고 걱정도 많지만, 주변 사람들에게 순수한 따뜻함을 선물하는 사랑스러운 사람입니다."
            },
            H: {
                title: "하치와레",
                img: "hachiware.jpg",
                desc: "당신은 긍정적이고 사교성이 넘치는 '하치와레'! 어려운 상황에서도 '어떻게든 될 거야!'라는 마인드로 솔선수범하는 분위기 메이커예요. 언어 감각도 뛰어나고 다정해서 주변에 늘 사람이 넘쳐납니다."
            },
            U: {
                title: "우사기",
                img: "usagi.jpg",
                desc: "당신은 자유로운 영혼의 예측불가 엉뚱천재 '우사기'! 남들의 시선 따위 신경 쓰지 않는 마이웨이 스타일이지만, 알고 보면 실력도 뛰어나고 전투력도 최상급이에요. 특유의 에너지가 주변을 항상 즐겁게 만듭니다."
            },
            M: {
                title: "모몽가",
                img: "momonga.jpg",
                desc: "당신은 귀여움을 한 몸에 받고 싶어 하는 '모몽가'! 당당하고 앙탈도 부릴 줄 아는 미워할 수 없는 매력의 소유자예요. 나 자신을 귀여워하고 사랑할 줄 알며, 타인의 관심과 칭찬을 에너지원으로 삼는 스타일입니다."
            },
            KR: {
                title: "쿠리만쥬",
                img: "kurimanju.jpg",
                desc: "당신은 소소한 낭만과 맛을 아는 어른스러운 '쿠리만쥬'! 겉으로는 무뚝뚝해 보이지만 맛있는 고기나 음료(술)를 마시고 '크아~' 하는 소소한 행복을 아는 낭만파예요. 후배들에게 무심한 척 쓱 선물을 건네는 따뜻한 츤데레입니다."
            },
            R: {
                title: "랏코",
                img: "rakko.jpg",
                desc: "당신은 든든하고 카리스마 넘치는 리더 '랏코'! 토벌 순위 1위에 빛나는 실력파로, 자기관리가 철저하고 남들을 이끄는 능력이 탁월해요. 하지만 파페나 달콤한 디저트 앞에서는 귀여운 반전 매력을 보여주는 매력 만점 스승님입니다."
            }
        };

        let currentQuestion = 0;
        let scores = { C: 0, H: 0, U: 0, M: 0, KR: 0, R: 0 };

        function startTest() {
            currentQuestion = 0;
            scores = { C: 0, H: 0, U: 0, M: 0, KR: 0, R: 0 };
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('progress-text').innerText = `질문 ${currentQuestion + 1} / ${questions.length}`;
            const percent = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress-percent').innerText = `${Math.round(percent)}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-pink-50 hover:bg-pink-100 text-gray-700 font-medium p-3.5 rounded-2xl border border-pink-200 transition transform hover:scale-[1.01] text-sm md:text-base';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.trait);
                container.appendChild(btn);
            });
        }

        function selectOption(trait) {
            scores[trait]++;
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            let highestTrait = 'C';
            let maxScore = -1;
            for (let trait in scores) {
                if (scores[trait] > maxScore) {
                    maxScore = scores[trait];
                    highestTrait = trait;
                }
            }

            const res = results[highestTrait];
            const imgTag = `<img src="${res.img}" alt="${res.title}" class="w-40 h-40 mx-auto object-contain">`;
    document.getElementById('result-emoji').innerHTML = imgTag;
            document.getElementById('result-title').innerText = res.title;
            document.getElementById('result-desc').innerText = res.desc;
        }

        function restartTest() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
